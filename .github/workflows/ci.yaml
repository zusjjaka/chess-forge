name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: root
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://auth_test:root@localhost:5432/auth_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        working-directory: backend/auth
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Mypy auth
        run: uv run --directory backend/auth mypy .

      - name: Generate JWT keys
        working-directory: backend/auth
        run: uv run python ../../scripts/generate_keys.py

      - name: Run migrations
        working-directory: backend/auth
        env:
          DATABASE_URL: postgresql+psycopg://auth_test:root@localhost:5432/auth_test
        run: uv run alembic upgrade head

      - name: Pytest
        working-directory: backend/auth
        run: uv run pytest
