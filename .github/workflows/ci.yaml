name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/auth_test

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        working-directory: backend/auth
        run: uv sync --locked

      - name: Ruff
        working-directory: backend/auth
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Mypy
        working-directory: backend/auth
        run: uv run mypy .

      - name: Pytest
        working-directory: backend/auth
        run: uv run pytest
