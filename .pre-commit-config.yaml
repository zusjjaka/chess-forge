repos:
  - repo: local
    hooks:
      # Auth
      - id: auth-ruff-check-fix
        name: Auth Ruff check --fix
        entry: uv run --directory backend/auth ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: auth-ruff-check
        name: Auth Ruff check
        entry: uv run --directory backend/auth ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: auth-mypy
        name: Auth Mypy
        entry: uv run --directory backend/auth mypy .
        language: system
        types: [python]
        pass_filenames: false

      # Email Sender
      - id: email-sender-ruff-check-fix
        name: Email Sender Ruff check --fix
        entry: uv run --directory backend/email_sender ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: email-sender-ruff-check
        name: Email Sender Ruff check
        entry: uv run --directory backend/email_sender ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: email-sender-mypy
        name: Email Sender Mypy
        entry: uv run --directory backend/email_sender mypy .
        language: system
        types: [python]
        pass_filenames: false

      # Repertoires
      - id: repertoires-ruff-check-fix
        name: Repertoires Ruff check --fix
        entry: uv run --directory backend/repertoires ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: repertoires-ruff-check
        name: Repertoires Ruff check
        entry: uv run --directory backend/repertoires ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: repertoires-mypy
        name: Repertoires Mypy
        entry: uv run --directory backend/repertoires mypy .
        language: system
        types: [python]
        pass_filenames: false
