repos:
  - repo: local
    hooks:
      - id: ruff-check-fix
        name: Ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: Ruff check
        entry: uv run --directory backend/auth ruff check
        language: system
        types: [python]

      - id: mypy
        name: Mypy
        entry: uv run --directory backend/auth mypy .
        language: system
        pass_filenames: false
